<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
<meta name="author" content="{{ .Site.Params.author }}">
{{ with .Site.Params.keywords }}<meta name="keywords" content="{{ . }}">{{ end }}
<link rel="canonical" href="{{ .Permalink }}">

{{ $og_image := "https://neurosam.ai/usecases/office-hero.png" }}

<!-- Open Graph -->
<meta property="og:title" content="{{ .Title }}">
<meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
<meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:site_name" content="{{ .Site.Title }}">
<meta property="og:locale" content="ko_KR">
<meta property="og:image" content="{{ $og_image }}">
<meta property="og:image:alt" content="neurosam.AI Open Source — 뉴로샘AI 오픈소스 프로젝트">

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ .Title }}">
<meta name="twitter:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
<meta name="twitter:image" content="{{ $og_image }}">

<!-- Favicon, theme-color, manifest -->
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<meta name="theme-color" content="#080e1a">
<meta name="apple-mobile-web-app-title" content="neurosam.AI OSS">

<!-- Robots / GEO -->
<meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1">

<!-- WebSite Schema (oss.neurosam.ai) -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "@id": "https://oss.neurosam.ai/#website",
  "name": "neurosam.AI Open Source",
  "alternateName": ["뉴로샘AI 오픈소스", "neurosam OSS"],
  "url": "https://oss.neurosam.ai/",
  "inLanguage": "ko-KR",
  "publisher": {"@id": "https://neurosam.ai/#organization"},
  "description": "neurosam.AI(뉴로샘AI)가 만들고 공개하는 오픈소스 프로젝트 카탈로그"

{{ if .IsPage }}
<!-- Article Schema -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "headline": "{{ .Title }}",
  "description": "{{ with .Description }}{{ . }}{{ end }}",
  "datePublished": "{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}",
  "dateModified": "{{ .Lastmod.Format "2006-01-02T15:04:05Z07:00" }}",
  "author": {"@type": "Organization", "@id": "https://neurosam.ai/#organization"},
  "publisher": {"@type": "Organization", "@id": "https://neurosam.ai/#organization"},
  "mainEntityOfPage": "{{ .Permalink }}"
}
</script>
{{ end }}

{{ partial "analytics.html" . }}
